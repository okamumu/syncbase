# Run the test suite in Docker (for Windows etc.; on a Mac plain
# `python3 -m unittest discover -s tests` works without Docker):
#
#   docker compose run --rm test
services:
  test:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    command: ["python", "-m", "unittest", "discover", "-s", "tests", "-v"]
